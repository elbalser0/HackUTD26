[project]
name = "breakglass"
version = "0.1.0"
description = "Break-Glass Handoff backend: detect manual infra changes, record context, warn before Terraform reverses them."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
breakglass = "breakglass.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["breakglass*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
